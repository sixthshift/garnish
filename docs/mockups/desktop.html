<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Garnish concepts</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<!--
  Desktop concepts for garnish: one file, no build. Opened from the repo it
  shows the household's own photos from data/images (gitignored); elsewhere a
  warm gradient stands in for each one. Every page inside the frame responds
  to the frame's width (container queries), so the width buttons show the
  same page at 1024, 1440, 1920 and 2560. "Phone" shows the same nine pages
  as a phone's concepts, in a 390 × 844 frame: swipes, sheets from the
  bottom, and the "+" in the tab bar as the command bar.
-->
<style>
:root {
  --bg: #f7f2ed; --paper: #fffcf9; --sunk: #f1e9e2; --line: #e8ddd4; --line2: #d8c9bd;
  --fg: #2a1f19; --fg2: #57473d; --muted: #8a7468;
  --brand: #2c666c; --brand-hover: #245358; --brand-soft: #d6eef0; --brand-50: #f2fafb;
  --hi: #fdeec9; --hi-line: #e3ac35; --ok: #3d7a4a; --ok-soft: #e1f0e3; --danger: #b3412e;
  --r: 12px; --r-sm: 8px;
  --shadow: 0 1px 2px rgba(60,40,30,.06), 0 6px 20px rgba(60,40,30,.07);
  --display: "Fraunces", Georgia, serif;
  --ui: "Inter", system-ui, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: #2b2420; font-family: var(--ui); color: var(--fg); font-size: 14px; overflow: hidden; }
button { font: inherit; color: inherit; cursor: pointer; }
input, textarea, select { font: inherit; color: inherit; }
kbd { font: 500 11px var(--ui); border: 1px solid var(--line2); border-bottom-width: 2px; border-radius: 5px; padding: 1px 5px; background: var(--paper); color: var(--muted); }

/* ── The mockup's own chrome, outside the app ───────────────────────────── */
#chrome { background: #1d1815; color: #efe6de; padding: 10px 16px 8px; display: flex; flex-direction: column; gap: 8px; }
#chrome .row { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
#chrome h1 { font: 600 15px var(--display); margin: 0 6px 0 0; letter-spacing: .01em; }
#chrome .seg { display: flex; background: #2d2622; border-radius: 9px; padding: 3px; gap: 2px; flex-wrap: wrap; }
#chrome .seg button { background: none; border: 0; color: #cbbcb0; padding: 5px 10px; border-radius: 7px; font-size: 12.5px; }
#chrome .seg button:hover { color: #fff; }
#chrome .seg button.on { background: #efe6de; color: #1d1815; font-weight: 600; }
#chrome .scale { font-size: 12px; color: #a8988b; margin-left: auto; }
#chrome .note { font-size: 13px; color: #d8cabe; line-height: 1.45; max-width: 1400px; }
#chrome .note b { color: #fff; font-weight: 600; }
#chrome .note .try { color: #e9c67a; }
#stage { display: flex; justify-content: center; padding: 12px 16px; overflow: hidden; }
#holder { position: relative; flex: none; }

/* ── The app frame ──────────────────────────────────────────────────────── */
#frame { position: absolute; top: 0; left: 0; transform-origin: 0 0; background: var(--bg); border-radius: 10px; overflow: hidden; display: flex; flex-direction: column; box-shadow: 0 20px 60px rgba(0,0,0,.45); }
#view { flex: 1; overflow: auto; container-type: inline-size; container-name: page; position: relative; scroll-behavior: smooth; }
.topbar { height: 56px; flex: none; display: flex; align-items: center; gap: 6px; padding: 0 20px; background: var(--paper); border-bottom: 1px solid var(--line); }
.logo { display: flex; align-items: center; gap: 8px; font: 600 19px var(--display); margin-right: 18px; color: var(--fg); background: none; border: 0; padding: 0; }
.logo svg { width: 18px; height: 22px; }
.nav { background: none; border: 0; padding: 8px 12px; border-radius: 8px; color: var(--fg2); font-size: 14.5px; }
.nav:hover { background: var(--sunk); }
.nav.on { background: #eadfd7; color: var(--fg); font-weight: 500; }
.cmdk { margin: 0 auto; width: min(460px, 36%); display: flex; align-items: center; gap: 10px; background: var(--sunk); border: 1px solid transparent; border-radius: 10px; padding: 8px 12px; color: var(--muted); text-align: left; }
.cmdk:hover { border-color: var(--line2); background: var(--paper); }
.cmdk span { flex: 1; }
.frame-cook .topbar { display: none; }

/* ── Shared pieces ──────────────────────────────────────────────────────── */
.page { padding: 24px 32px 48px; }
.h1 { font: 600 34px/1.1 var(--display); letter-spacing: -.01em; margin: 0; }
.h2 { font: 600 22px/1.2 var(--display); margin: 0; }
.label { font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.sub { color: var(--muted); }
.card { background: var(--paper); border: 1px solid var(--line); border-radius: var(--r); }
.btn { border: 1px solid var(--line2); background: var(--paper); border-radius: 8px; padding: 7px 13px; font-size: 13.5px; font-weight: 500; white-space: nowrap; }
.btn:hover { background: var(--sunk); }
.btn.primary { background: var(--brand); border-color: var(--brand); color: #fff; }
.btn.primary:hover { background: var(--brand-hover); }
.btn.ghost { border-color: transparent; background: none; }
.btn.sm { padding: 4px 9px; font-size: 12.5px; }
.chip { display: inline-flex; align-items: center; gap: 4px; border: 1px solid var(--line); border-radius: 999px; padding: 2px 9px; font-size: 12px; color: var(--fg2); background: var(--paper); white-space: nowrap; }
.chip.solid { background: var(--sunk); border-color: transparent; }
.photo { background-size: cover; background-position: center; background-color: #d9c4b4; }
.input { width: 100%; border: 1px solid var(--line2); background: var(--paper); border-radius: 9px; padding: 9px 12px; outline: none; }
.input:focus { border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-soft); }
.row { display: flex; align-items: center; gap: 10px; }
.grow { flex: 1; min-width: 0; }
.check { width: 18px; height: 18px; border: 1.5px solid var(--line2); border-radius: 5px; flex: none; display: grid; place-items: center; background: var(--paper); }
.check.on { background: var(--brand); border-color: var(--brand); }
.check.on::after { content: ""; width: 9px; height: 5px; border: 2px solid #fff; border-top: 0; border-right: 0; transform: rotate(-45deg) translate(1px,-1px); }
.toasts { position: absolute; left: 50%; bottom: 24px; transform: translateX(-50%); display: flex; flex-direction: column; gap: 8px; align-items: center; z-index: 50; pointer-events: none; }
.toast { background: #2a1f19; color: #fff; padding: 10px 16px; border-radius: 10px; box-shadow: var(--shadow); font-size: 13.5px; animation: toast .25s ease-out; display: flex; gap: 12px; align-items: center; }
.toast b { color: #9fd6d9; font-weight: 600; }
@keyframes toast { from { opacity: 0; transform: translateY(8px); } }
@keyframes pop { 0% { transform: scale(.92); opacity: 0; } 60% { transform: scale(1.02); } 100% { transform: none; opacity: 1; } }
.pop { animation: pop .35s ease-out; }

/* ── Home: the bento ────────────────────────────────────────────────────── */
.home-head { display: flex; align-items: flex-end; gap: 18px; margin-bottom: 20px; }
.bento { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); grid-auto-rows: 118px; grid-auto-flow: dense; gap: 16px; }
.tile { background: var(--paper); border: 1px solid var(--line); border-radius: 16px; padding: 18px; overflow: hidden; display: flex; flex-direction: column; gap: 10px; position: relative; }
.t-week { grid-column: 1 / -1; grid-row: span 2; padding: 14px; }
.t-tonight { grid-column: span 2; grid-row: span 4; padding: 0; border: 0; color: #fff; justify-content: flex-end; }
.t-tonight .photo { position: absolute; inset: 0; }
.t-tonight::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0,0,0,0) 35%, rgba(20,12,8,.82)); }
.t-tonight .in { position: relative; z-index: 1; padding: 26px 28px; display: flex; flex-direction: column; gap: 10px; }
.t-tonight .name { font: 600 38px/1.05 var(--display); max-width: 18ch; }
.t-tonight .btn { background: rgba(255,255,255,.16); border-color: rgba(255,255,255,.35); color: #fff; backdrop-filter: blur(6px); }
.t-tonight .btn.primary { background: #fff; color: var(--brand); border-color: #fff; }
.t-shop { grid-row: span 4; }
.t-next { grid-row: span 2; background: var(--brand); color: #fff; border-color: var(--brand); justify-content: space-between; }
.t-next .btn { background: #fff; color: var(--brand); border-color: #fff; align-self: flex-start; }
.t-while { grid-row: span 3; }
.t-try { grid-column: span 2; grid-row: span 3; }
.t-nextweek { grid-column: span 2; grid-row: span 2; }
.t-recent { grid-row: span 3; }
@container page (max-width: 700px) { .t-tonight, .t-try, .t-nextweek { grid-column: span 1; } }
.weekribbon { display: grid; grid-template-columns: repeat(7, 1fr); gap: 10px; height: 100%; }
.wday { border-radius: 11px; overflow: hidden; position: relative; background: var(--sunk); display: flex; flex-direction: column; justify-content: flex-end; color: #fff; min-width: 0; }
.wday .photo { position: absolute; inset: 0; }
.wday::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0,0,0,.05), rgba(20,12,8,.72)); }
.wday .in { position: relative; z-index: 1; padding: 9px 11px; }
.wday .d { font-size: 11.5px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; opacity: .9; }
.wday .n { font-weight: 500; font-size: 13.5px; line-height: 1.25; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.wday.empty { background: none; border: 1.5px dashed var(--line2); color: var(--muted); justify-content: center; align-items: center; text-align: center; }
.wday.empty::after { display: none; }
.wday.today { outline: 3px solid var(--brand); outline-offset: 2px; }
.wday.past { filter: saturate(.6); opacity: .75; }
.ring { width: 84px; height: 84px; flex: none; }
.shoprow { display: flex; align-items: center; gap: 10px; padding: 7px 0; border-bottom: 1px solid var(--sunk); cursor: pointer; }
.shoprow.done .t { text-decoration: line-through; color: var(--muted); }
.mini { display: flex; align-items: center; gap: 11px; padding: 6px 0; }
.mini .photo { width: 46px; height: 46px; border-radius: 9px; flex: none; }
.trystrip { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(150px, 1fr); gap: 12px; flex: 1; min-height: 0; overflow-x: auto; scroll-snap-type: x mandatory; }
.trystrip > * { scroll-snap-align: start; }
.trycard { border-radius: 12px; overflow: hidden; position: relative; color: #fff; display: flex; align-items: flex-end; }
.trycard .photo { position: absolute; inset: 0; transition: transform .4s; }
.trycard:hover .photo { transform: scale(1.05); }
.trycard::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, transparent 45%, rgba(20,12,8,.8)); }
.trycard span { position: relative; z-index: 1; padding: 10px 12px; font-weight: 500; line-height: 1.25; }
.slots { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; flex: 1; }
.slot { border: 1.5px dashed var(--line2); border-radius: 9px; display: flex; flex-direction: column; justify-content: space-between; padding: 7px 8px; font-size: 12px; color: var(--muted); min-width: 0; }
.slot.full { border: 0; background: var(--brand-50); color: var(--fg); box-shadow: inset 0 0 0 1px var(--brand-soft); }
.slot b { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.slot span { overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }

/* ── Plan: the board ────────────────────────────────────────────────────── */
.planpage { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 0; height: 100%; }
.board { padding: 22px 28px 48px; container-type: inline-size; container-name: board; min-width: 0; overflow: auto; }
.board-head { display: flex; align-items: center; gap: 14px; margin-bottom: 18px; }
.weekarrows { display: flex; gap: 4px; margin-left: auto; align-items: center; }
.weekarrows .btn { width: 38px; height: 38px; padding: 0; font-size: 18px; }
.weekblock { margin-bottom: 26px; }
.weekbar { display: flex; align-items: baseline; gap: 12px; margin-bottom: 10px; }
.weekbar .h2 { font-size: 19px; }
.meter { flex: 0 0 120px; height: 6px; background: var(--sunk); border-radius: 9px; overflow: hidden; align-self: center; }
.meter i { display: block; height: 100%; background: var(--brand); border-radius: 9px; }
.week { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 10px; }
.day { background: var(--paper); border: 1px solid var(--line); border-radius: 14px; padding: 10px; display: flex; flex-direction: column; gap: 8px; min-height: 250px; transition: box-shadow .15s, border-color .15s, background .15s; min-width: 0; }
.day.past { background: transparent; }
.day.past .entry { opacity: .7; }
.day.today { border-color: var(--brand); box-shadow: 0 0 0 1px var(--brand); }
.day.picked { background: var(--brand-50); border-color: var(--brand); }
.day.over { background: var(--hi); border-color: var(--hi-line); box-shadow: 0 0 0 3px rgba(227,172,53,.25); }
.dayhead { display: flex; align-items: baseline; gap: 6px; }
.dayhead b { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; }
.dayhead .sub { font-size: 12.5px; }
.pill { font-size: 11px; font-weight: 600; background: var(--brand); color: #fff; border-radius: 99px; padding: 1px 7px; }
.entry { border-radius: 10px; overflow: hidden; background: var(--paper); border: 1px solid var(--line); cursor: grab; transition: transform .15s, box-shadow .15s; }
.entry:hover { transform: translateY(-1px); box-shadow: var(--shadow); }
.entry .photo { aspect-ratio: 16/10; }
.entry .in { padding: 7px 9px 8px; display: flex; flex-direction: column; gap: 3px; }
.entry .nm { font-weight: 500; font-size: 13px; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.entry.note { padding: 9px; font-style: italic; color: var(--fg2); background: var(--sunk); border-color: transparent; }
.drop { flex: 1; min-height: 56px; border: 1.5px dashed var(--line2); border-radius: 10px; display: grid; place-items: center; color: var(--muted); font-size: 12.5px; background: none; text-align: center; padding: 6px; }
.entry ~ .drop { flex: 0 0 auto; }
.drop:hover { border-color: var(--brand); color: var(--brand); }
.dayfoot { font-size: 11.5px; color: var(--muted); border-top: 1px solid var(--sunk); padding-top: 7px; }
@container board (max-width: 880px) {
  .week { grid-template-columns: 1fr; gap: 8px; }
  .day { min-height: 0; flex-direction: row; flex-wrap: wrap; align-items: center; }
  .dayhead { width: 100px; flex-direction: column; gap: 0; }
  .entry { display: flex; align-items: center; width: 220px; }
  .entry .photo { width: 56px; aspect-ratio: 1; flex: none; }
  .drop { flex: 1; min-height: 40px; }
  .dayfoot { border: 0; padding: 0; }
}
.shelf { border-left: 1px solid var(--line); background: var(--paper); padding: 20px 18px; display: flex; flex-direction: column; gap: 12px; min-height: 0; }
.shelf .tabs { display: flex; gap: 2px; background: var(--sunk); padding: 3px; border-radius: 9px; }
.shelf .tabs button { flex: 1; border: 0; background: none; padding: 6px; border-radius: 7px; font-size: 12.5px; color: var(--fg2); }
.shelf .tabs button.on { background: var(--paper); color: var(--fg); font-weight: 500; box-shadow: 0 1px 2px rgba(0,0,0,.08); }
.shelflist { overflow: auto; display: flex; flex-direction: column; gap: 6px; margin: 0 -6px; padding: 0 6px; flex: 1; }
.scard { display: flex; align-items: center; gap: 10px; padding: 6px; border-radius: 10px; border: 1px solid transparent; cursor: grab; background: none; text-align: left; width: 100%; }
.scard:hover { background: var(--sunk); border-color: var(--line); }
.scard .photo { width: 52px; height: 52px; border-radius: 9px; flex: none; }
.scard .nm { font-weight: 500; line-height: 1.3; }
.scard .grip { color: var(--line2); letter-spacing: -2px; margin-left: auto; }
.target { background: var(--brand-50); border: 1px solid var(--brand-soft); border-radius: 10px; padding: 10px 12px; }

/* ── Shopping ───────────────────────────────────────────────────────────── */
.shop-head { display: flex; align-items: center; gap: 22px; margin-bottom: 18px; flex-wrap: wrap; }
.progress { flex: 1; min-width: 240px; max-width: 560px; }
.progress .bar { height: 10px; background: var(--sunk); border-radius: 99px; overflow: hidden; margin-top: 6px; }
.progress .bar i { display: block; height: 100%; background: linear-gradient(90deg, var(--brand), #4ba5a9); border-radius: 99px; transition: width .4s; }
.addrow { position: relative; margin-bottom: 20px; max-width: 760px; }
.addrow .input { padding: 12px 14px 12px 40px; font-size: 15px; }
.addrow .plus { position: absolute; left: 14px; top: 11px; color: var(--muted); font-size: 18px; }
.addrow .guess { position: absolute; right: 10px; top: 9px; }
.shopgrid { display: grid; grid-template-columns: minmax(0, 1fr) 260px 290px; gap: 24px; align-items: start; }
.aisles { columns: 250px; column-gap: 22px; }
.aisle { break-inside: avoid; margin-bottom: 20px; }
.aisle h3 { margin: 0 0 6px; display: flex; justify-content: space-between; }
.item { display: flex; gap: 10px; align-items: flex-start; padding: 8px 6px; border-radius: 8px; cursor: pointer; transition: opacity .2s, background .2s, transform .25s; }
.item:hover { background: var(--paper); }
.item .q { font-weight: 600; }
.item .m { font-size: 12px; color: var(--muted); margin-top: 1px; }
.item.leaving { opacity: 0; transform: translateX(30px); }
.shopgrid.focus .item { opacity: .28; }
.shopgrid.focus .item.lit { opacity: 1; background: var(--hi); box-shadow: inset 3px 0 0 var(--hi-line); }
.trolley { background: var(--sunk); border-radius: 14px; padding: 14px; position: sticky; top: 16px; }
.trolley .item { opacity: .65; padding: 5px 4px; }
.trolley .item .t { text-decoration: line-through; }
.trolleybar { display: none; }
.mealkey { position: sticky; top: 16px; display: flex; flex-direction: column; gap: 4px; }
.meal { display: flex; gap: 10px; align-items: center; padding: 7px; border-radius: 10px; border: 1px solid transparent; cursor: pointer; background: none; text-align: left; width: 100%; }
.meal:hover, .meal.on { background: var(--paper); border-color: var(--hi-line); }
.meal .photo { width: 40px; height: 40px; border-radius: 8px; flex: none; }
.meal .ct { margin-left: auto; font-size: 12px; color: var(--muted); }
@container page (max-width: 1360px) {
  .shopgrid { grid-template-columns: minmax(0, 1fr) 260px; }
  .trolley { display: none; }
  .trolleybar { display: flex; }
}

/* ── Recipes: three panes ───────────────────────────────────────────────── */
.lib { display: grid; grid-template-columns: 250px minmax(0, 1fr) 0; height: 100%; transition: grid-template-columns .3s; }
.lib.reading { grid-template-columns: 250px minmax(0, 1fr) clamp(420px, 34%, 720px); }
.facets { border-right: 1px solid var(--line); padding: 20px 16px; overflow: auto; display: flex; flex-direction: column; gap: 18px; background: var(--paper); }
.facet { display: flex; flex-direction: column; gap: 2px; }
.facet .label { margin-bottom: 6px; }
.fbtn { display: flex; justify-content: space-between; align-items: center; border: 0; background: none; padding: 6px 9px; border-radius: 7px; color: var(--fg2); text-align: left; }
.fbtn:hover { background: var(--sunk); }
.fbtn.on { background: var(--brand-50); color: var(--brand); font-weight: 600; }
.fbtn .ct { font-size: 12px; color: var(--muted); }
.wallpane { overflow: auto; padding: 20px 26px 40px; }
.wallhead { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
.wall { columns: 220px; column-gap: 16px; }
.rcard { break-inside: avoid; margin-bottom: 16px; display: block; width: 100%; padding: 0; border: 0; background: none; text-align: left; border-radius: 14px; outline-offset: 3px; }
.rcard .photo { border-radius: 14px; position: relative; transition: transform .25s, box-shadow .25s; }
.rcard:hover .photo { transform: translateY(-2px); box-shadow: var(--shadow); }
.rcard.sel .photo { outline: 3px solid var(--brand); outline-offset: 3px; }
.rcard .heart { position: absolute; top: 9px; right: 9px; width: 30px; height: 30px; border-radius: 99px; background: rgba(255,252,249,.88); display: grid; place-items: center; font-size: 14px; }
.rcard .time { position: absolute; left: 9px; bottom: 9px; background: rgba(20,12,8,.62); color: #fff; font-size: 11.5px; font-weight: 600; padding: 2px 8px; border-radius: 99px; backdrop-filter: blur(4px); }
.rcard .nm { font-weight: 500; font-size: 14.5px; margin: 8px 2px 2px; line-height: 1.3; }
.rcard .tg { font-size: 12px; color: var(--muted); margin: 0 2px; }
.reader { border-left: 1px solid var(--line); background: var(--paper); overflow: auto; container-type: inline-size; container-name: reader; min-width: 0; }
.reader .hero { aspect-ratio: 16/9; position: relative; }
.reader .x { position: absolute; top: 12px; right: 12px; width: 34px; height: 34px; border-radius: 99px; border: 0; background: rgba(255,252,249,.9); font-size: 18px; }
.reader .in { padding: 18px 22px 30px; display: flex; flex-direction: column; gap: 14px; }
.reader .cols { display: grid; grid-template-columns: 1fr; gap: 20px; }
@container reader (min-width: 600px) { .reader .cols { grid-template-columns: minmax(0, .8fr) minmax(0, 1.2fr); } }
.ing { display: flex; gap: 10px; padding: 5px 0; line-height: 1.4; }
.ing .q { font-weight: 600; white-space: nowrap; }
.ing .nt { color: var(--muted); font-size: 12.5px; }
.ol { display: flex; flex-direction: column; gap: 10px; margin: 0; padding: 0; list-style: none; }
.ol li { display: flex; gap: 10px; line-height: 1.5; }
.num { width: 24px; height: 24px; border-radius: 99px; background: var(--sunk); font-size: 12px; font-weight: 600; display: grid; place-items: center; flex: none; margin-top: 1px; }

/* ── Recipe: the spread ─────────────────────────────────────────────────── */
.spread { display: grid; grid-template-columns: minmax(340px, .95fr) minmax(280px, .75fr) minmax(400px, 1.3fr); gap: 0; height: 100%; }
.spread > * { overflow: auto; min-height: 0; }
.leftpage { display: flex; flex-direction: column; background: var(--paper); border-right: 1px solid var(--line); overflow: auto; }
.leftpage .photo { flex: 1 1 45%; min-height: 260px; }
.leftpage .in { padding: 22px 26px 26px; display: flex; flex-direction: column; gap: 12px; }
.leftpage .title { font: 600 34px/1.1 var(--display); margin: 0; }
.facts { display: flex; gap: 18px; flex-wrap: wrap; }
.facts div { display: flex; flex-direction: column; }
.facts b { font-size: 16px; }
.facts span { font-size: 12px; color: var(--muted); }
.stars { color: #d39b2a; letter-spacing: 2px; }
.ingpage { padding: 26px 22px 60px; border-right: 1px solid var(--line); }
.methodpage { padding: 26px 34px 80px; }
.methodpage .step { display: grid; grid-template-columns: 34px minmax(0, 62ch); gap: 12px; padding: 14px; border-radius: 12px; transition: background .15s; }
.step .num { width: 30px; height: 30px; font-size: 13px; }
.step .lbl { font-weight: 600; margin-bottom: 2px; }
.step .tx { line-height: 1.6; font-size: 15px; }
.step .nt { color: var(--muted); font-size: 13.5px; margin-top: 4px; }
.timerchip { display: inline-flex; gap: 5px; align-items: center; margin-top: 8px; background: var(--brand-50); color: var(--brand); border: 1px solid var(--brand-soft); border-radius: 99px; font-size: 12px; font-weight: 600; padding: 2px 10px; }
.serves { display: flex; align-items: center; gap: 6px; margin: 10px 0 14px; }
.serves button { width: 30px; height: 30px; border-radius: 8px; border: 1px solid var(--line2); background: var(--paper); font-size: 16px; }
.serves b { min-width: 74px; text-align: center; }
.ilist .ing { padding: 6px 8px; border-radius: 8px; transition: background .15s; cursor: default; }
.lit-i { background: var(--hi); box-shadow: inset 3px 0 0 var(--hi-line); }
.dim-s { opacity: .35; }
.step.lit-s { background: var(--hi); }
.notespage { display: none; padding: 26px 26px 60px; border-left: 1px solid var(--line); background: var(--paper); }
.notespage .card { padding: 14px; margin-bottom: 12px; }
.tl { border-left: 2px solid var(--line); padding-left: 14px; display: flex; flex-direction: column; gap: 12px; }
.tl > div { position: relative; }
.tl > div::before { content: ""; position: absolute; left: -20px; top: 5px; width: 10px; height: 10px; border-radius: 99px; background: var(--paper); border: 2px solid var(--brand); }
@container page (min-width: 1800px) {
  .spread { grid-template-columns: minmax(380px, .9fr) minmax(300px, .7fr) minmax(460px, 1.2fr) minmax(320px, .6fr); }
  .notespage { display: block; }
}
@container page (max-width: 1250px) {
  .spread { grid-template-columns: minmax(260px, .8fr) minmax(0, 1.2fr); height: auto; }
  .spread > * { overflow: visible; }
  .leftpage { grid-column: 1 / -1; flex-direction: row; border-right: 0; border-bottom: 1px solid var(--line); }
  .leftpage .photo { flex: 0 0 42%; min-height: 320px; }
}

/* ── Import: side by side ───────────────────────────────────────────────── */
.steps3 { display: flex; align-items: center; gap: 12px; }
.steps3 .s { display: flex; align-items: center; gap: 8px; color: var(--muted); }
.steps3 .s i { width: 26px; height: 26px; border-radius: 99px; border: 1.5px solid var(--line2); display: grid; place-items: center; font-style: normal; font-size: 12px; font-weight: 600; }
.steps3 .s.done i { background: var(--brand); border-color: var(--brand); color: #fff; }
.steps3 .s.on { color: var(--fg); font-weight: 600; }
.steps3 .s.on i { border-color: var(--brand); color: var(--brand); box-shadow: 0 0 0 3px var(--brand-soft); }
.steps3 hr { width: 40px; border: 0; border-top: 1.5px solid var(--line2); }
.imp { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 20px; height: calc(100% - 90px); }
.imp .pane { display: flex; flex-direction: column; min-height: 0; }
.pane .bar { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-bottom: 1px solid var(--line); }
.src { overflow: auto; padding: 12px 0; font-size: 13.5px; line-height: 1.55; flex: 1; scroll-behavior: smooth; }
.src p { margin: 0; padding: 3px 18px 3px 44px; position: relative; transition: background .2s; }
.src p::before { content: attr(data-n); position: absolute; left: 10px; width: 24px; text-align: right; color: var(--line2); font-size: 11px; top: 5px; font-variant-numeric: tabular-nums; }
.src p.skip { color: #b9aaa0; }
.src p.used { color: var(--fg2); }
.src p.lit { background: var(--hi); color: var(--fg); box-shadow: inset 3px 0 0 var(--hi-line); }
.src h4 { margin: 10px 18px 4px 44px; font-size: 15px; }
.parsed { overflow: auto; flex: 1; padding: 16px 18px 30px; display: flex; flex-direction: column; gap: 16px; }
.pl { display: flex; gap: 10px; padding: 6px 8px; border-radius: 8px; cursor: pointer; align-items: flex-start; line-height: 1.45; transition: background .15s; }
.pl:hover, .pl.lit { background: var(--hi); }
.pl .src-n { margin-left: auto; font-size: 11px; color: var(--line2); flex: none; padding-top: 2px; }
.flag { width: 8px; height: 8px; border-radius: 99px; background: var(--hi-line); flex: none; margin-top: 7px; }
.ok { width: 8px; height: 8px; border-radius: 99px; background: #9cc7a4; flex: none; margin-top: 7px; }
.impside { display: none; }
@container page (min-width: 1900px) {
  .imp { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) 360px; }
  .impside { display: flex; }
}

/* ── Editor: form and preview ───────────────────────────────────────────── */
.ed { display: grid; grid-template-columns: minmax(460px, 1fr) minmax(460px, 1fr); height: 100%; }
.edform { overflow: auto; padding: 22px 30px 60px; display: flex; flex-direction: column; gap: 16px; border-right: 1px solid var(--line); }
.edform label { display: flex; flex-direction: column; gap: 6px; font-weight: 500; font-size: 13px; }
.edform textarea { resize: vertical; min-height: 200px; line-height: 1.6; font-size: 13.5px; }
.edgrid { display: grid; grid-template-columns: 2fr 1fr 1fr 1fr; gap: 12px; }
.edprev { overflow: auto; background: var(--sunk); padding: 22px 30px 60px; }
.edprev .sheet { max-width: 820px; margin: 0 auto; background: var(--paper); border-radius: 16px; box-shadow: var(--shadow); overflow: hidden; }
.edprev .sheet .photo { aspect-ratio: 21/9; }
.edprev .sheet .in { padding: 22px 28px 30px; display: flex; flex-direction: column; gap: 16px; }
.edprev .cols { display: grid; grid-template-columns: minmax(0, .8fr) minmax(0, 1.3fr); gap: 26px; }
.flash { animation: flash .6s ease-out; }
@keyframes flash { from { background: var(--hi); } }

/* ── Cook: the filmstrip ────────────────────────────────────────────────── */
.cook { height: 100%; background: #1d1714; color: #f3ebe3; display: grid; grid-template-rows: auto 1fr auto; }
.cooktop { display: flex; align-items: center; gap: 16px; padding: 14px 24px; }
.cooktop .x { background: #2f2723; border: 0; color: #f3ebe3; border-radius: 10px; padding: 8px 14px; }
.segs { display: flex; gap: 4px; flex: 1; max-width: 640px; margin-left: auto; }
.segs i { flex: 1; height: 5px; border-radius: 9px; background: #3a302b; }
.segs i.done { background: #4ba5a9; }
.segs i.on { background: #f3ebe3; }
.cookbody { display: grid; grid-template-columns: 320px minmax(0, 1fr); min-height: 0; }
.forstep { padding: 18px 24px; border-right: 1px solid #2f2723; overflow: auto; }
.forstep .label { color: #a8968a; }
.forstep .ing { display: block; font-size: 17px; padding: 9px 0; border-bottom: 1px solid #2a221f; }
.forstep .ing .nt { color: #a8968a; }
.film { display: flex; align-items: center; justify-content: center; gap: 28px; padding: 20px 30px; overflow: hidden; }
.fcard { flex: 0 0 24%; background: #2a221f; border-radius: 20px; padding: 26px; color: #b5a69a; transition: all .35s; cursor: pointer; font-size: 16px; line-height: 1.5; max-height: 70%; overflow: hidden; border: 0; text-align: left; }
.fcard .lbl { font-weight: 600; color: #d9cbbf; margin-bottom: 8px; }
.fcard.cur { flex: 0 0 min(46%, 900px); background: #f7f0e9; color: #2a1f19; padding: 40px 44px; font-size: clamp(22px, 1.9cqw, 34px); line-height: 1.45; max-height: none; cursor: default; box-shadow: 0 30px 80px rgba(0,0,0,.45); }
.fcard.cur .lbl { color: var(--brand); font-size: .62em; letter-spacing: .08em; text-transform: uppercase; }
.fcard.cur .nt { color: #8a7468; font-size: .6em; margin-top: 16px; }
.fcard .k { font-size: 12px; color: #8b7a6e; margin-bottom: 10px; }
.cookfoot { display: flex; align-items: center; gap: 14px; padding: 14px 24px 20px; }
.ctimer { display: flex; align-items: center; gap: 12px; background: #2a221f; border-radius: 14px; padding: 10px 16px; }
.ctimer b { font-size: 24px; font-variant-numeric: tabular-nums; }
.ctimer.done b { color: #8fd19e; }
.bigbtn { padding: 14px 28px; border-radius: 14px; border: 0; font-size: 17px; font-weight: 600; background: #2f2723; color: #f3ebe3; }
.bigbtn.go { background: #4ba5a9; color: #0f2a2c; }

/* ── Settings ───────────────────────────────────────────────────────────── */
.set { display: grid; grid-template-columns: 230px minmax(0, 1fr) 0; height: 100%; }
.set.inspecting { grid-template-columns: 230px minmax(0, 1fr) 380px; }
.rail { border-right: 1px solid var(--line); padding: 20px 12px; overflow: auto; background: var(--paper); display: flex; flex-direction: column; gap: 16px; }
.rail .label { padding: 0 9px 4px; }
.grid-wrap { overflow: auto; padding: 20px 26px 40px; }
table.dg { width: 100%; border-collapse: separate; border-spacing: 0; background: var(--paper); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.dg th { text-align: left; font-size: 12px; font-weight: 600; color: var(--muted); padding: 10px 12px; border-bottom: 1px solid var(--line); background: var(--sunk); position: sticky; top: 0; white-space: nowrap; }
.dg td { padding: 8px 12px; border-bottom: 1px solid var(--sunk); vertical-align: middle; }
.dg tr:hover td { background: #fbf6f1; }
.dg tr.sel td { background: var(--brand-50); }
.dg td.cell { cursor: text; }
.dg td.cell:hover { box-shadow: inset 0 0 0 1px var(--line2); }
.dg td[contenteditable="true"] { box-shadow: inset 0 0 0 2px var(--brand); background: #fff; outline: none; }
.dg .col-wide { display: none; }
@container page (min-width: 1700px) { .dg .col-wide { display: table-cell; } }
.bulk { position: absolute; left: 50%; bottom: 26px; transform: translateX(-50%); background: #2a1f19; color: #fff; padding: 8px 8px 8px 16px; border-radius: 12px; display: flex; gap: 8px; align-items: center; box-shadow: var(--shadow); z-index: 20; animation: toast .2s; }
.bulk .btn { background: #3a2f29; border-color: #4a3d36; color: #fff; }
.inspector { border-left: 1px solid var(--line); background: var(--paper); overflow: auto; padding: 22px; display: flex; flex-direction: column; gap: 16px; }
.inspector .field { display: flex; flex-direction: column; gap: 6px; }
.aliases { display: flex; flex-wrap: wrap; gap: 6px; }
.aliases .chip button { border: 0; background: none; padding: 0; color: var(--muted); }

/* ── Command bar ────────────────────────────────────────────────────────── */
.scrim { position: absolute; inset: 0; background: rgba(30,20,14,.35); backdrop-filter: blur(2px); z-index: 40; display: flex; justify-content: center; align-items: flex-start; padding-top: 11vh; animation: toast .15s; }
.palette { width: min(680px, 90%); background: var(--paper); border-radius: 16px; box-shadow: 0 30px 80px rgba(30,20,14,.35); overflow: hidden; }
.palette .q { display: flex; align-items: center; gap: 12px; padding: 16px 18px; border-bottom: 1px solid var(--line); }
.palette .q input { flex: 1; border: 0; outline: none; font-size: 18px; background: none; }
.palette .res { max-height: 440px; overflow: auto; padding: 8px; }
.palette .grp { padding: 8px 10px 4px; }
.palette .opt { display: flex; align-items: center; gap: 12px; padding: 9px 10px; border-radius: 10px; cursor: pointer; }
.palette .opt.on { background: var(--brand-50); box-shadow: inset 0 0 0 1px var(--brand-soft); }
.palette .opt .photo, .palette .opt .ic { width: 34px; height: 34px; border-radius: 8px; flex: none; }
.palette .opt .ic { background: var(--sunk); display: grid; place-items: center; font-size: 16px; }
.palette .opt .hint { margin-left: auto; font-size: 12px; color: var(--muted); }
.palette .foot { display: flex; gap: 16px; padding: 10px 18px; border-top: 1px solid var(--line); font-size: 12px; color: var(--muted); background: var(--sunk); }
.palette mark { background: var(--hi); color: inherit; border-radius: 3px; }

/* ═════════════════════════════════════════════════════════════════════════
   The phone: the same pages for a hand, not a desk. Everything below is
   scoped to the phone frame's own classes (m-*), so the desktop is untouched.
   ═════════════════════════════════════════════════════════════════════════ */
#frame.phone { border-radius: 48px; box-shadow: 0 0 0 11px #0e0b0a, 0 0 0 13px #4a403a, 0 30px 90px rgba(0,0,0,.55); }
.statusbar, .tabbar, .homebar { display: none; }
.phone .statusbar { display: flex; flex: none; height: 50px; padding: 15px 32px 0; justify-content: space-between; align-items: flex-start; font: 600 15px var(--ui); position: relative; background: var(--bg); z-index: 6; }
.statusbar .island { position: absolute; left: 50%; top: 11px; transform: translateX(-50%); width: 120px; height: 34px; border-radius: 20px; background: #050404; }
.statusbar .sig { letter-spacing: 1px; font-size: 13px; }
.phone .topbar { display: none; }
.phone .tabbar { display: grid; flex: none; grid-template-columns: repeat(5, 1fr); height: 84px; padding: 8px 6px 0; background: rgba(255,252,249,.94); backdrop-filter: blur(14px); border-top: 1px solid var(--line); position: relative; z-index: 6; }
.tabbar button { border: 0; background: none; display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 10.5px; font-weight: 500; color: var(--muted); padding: 2px 0; }
.tabbar button svg { width: 25px; height: 25px; }
.tabbar button.on { color: var(--brand); }
.tabbar .fab { width: 56px; height: 56px; border-radius: 19px; background: var(--brand); color: #fff; margin: -20px auto 0; box-shadow: 0 10px 22px rgba(44,102,108,.42); display: grid; place-items: center; padding: 0; }
.tabbar .fab svg { width: 26px; height: 26px; }
.phone .homebar { display: block; position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%); width: 134px; height: 5px; border-radius: 3px; background: #1d1714; z-index: 70; pointer-events: none; }
.phone.frame-cook .statusbar { background: #1d1714; color: #f3ebe3; }
.phone.frame-cook .tabbar { display: none; }
.phone.frame-cook .homebar { background: #f3ebe3; }
.phone .toasts { top: 58px; bottom: auto; width: 92%; }
.phone .toast { width: 100%; justify-content: center; text-align: center; }
.phone #view { scrollbar-width: none; }
.phone #view::-webkit-scrollbar { display: none; }

.mp { padding: 6px 18px 28px; display: flex; flex-direction: column; gap: 16px; }
.mhead { display: flex; align-items: flex-end; justify-content: space-between; }
.mround { width: 40px; height: 40px; border-radius: 99px; border: 1px solid var(--line); background: var(--paper); display: grid; place-items: center; font-size: 17px; flex: none; position: relative; padding: 0; }
.mround.glass { background: rgba(255,252,249,.85); border-color: transparent; backdrop-filter: blur(8px); }
.mround.dark { background: #2f2723; border-color: #3a302b; color: #f3ebe3; }
.mround .badge { position: absolute; top: -3px; right: -3px; background: var(--brand); color: #fff; font-size: 10px; border-radius: 99px; min-width: 17px; height: 17px; display: grid; place-items: center; }
.msh { font: 600 18px var(--display); margin: 0; }
.mlink { border: 0; background: none; color: var(--brand); font-weight: 600; font-size: 14px; padding: 4px 0; align-self: flex-start; }
.msec { display: flex; flex-direction: column; gap: 10px; }
.mcard { background: var(--paper); border: 1px solid var(--line); border-radius: 18px; padding: 14px 16px; }
.btn.big { padding: 12px 18px; font-size: 15px; border-radius: 12px; }
.btn.glass { background: rgba(255,255,255,.18); border-color: rgba(255,255,255,.35); color: #fff; backdrop-filter: blur(6px); }

/* Home */
.mhero { position: relative; aspect-ratio: 4/5; border-radius: 26px; overflow: hidden; color: #fff; display: flex; align-items: flex-end; box-shadow: var(--shadow); flex: none; }
.mhero .photo { position: absolute; inset: 0; }
.mhero::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, transparent 40%, rgba(20,12,8,.86)); }
.mhero .in { position: relative; z-index: 1; padding: 20px; display: flex; flex-direction: column; gap: 6px; width: 100%; }
.mhero .name { font: 600 30px/1.08 var(--display); }
.mhero .btn.primary { background: #fff; color: var(--brand); border-color: #fff; }
.mstrip, .mstories, .mchips { display: flex; gap: 10px; overflow-x: auto; scroll-snap-type: x mandatory; scroll-padding-inline: 18px; margin: 0 -18px; padding: 2px 18px 4px; scrollbar-width: none; flex: none; }
.mstrip::-webkit-scrollbar, .mstories::-webkit-scrollbar, .mchips::-webkit-scrollbar { display: none; }
.mday-card { flex: 0 0 108px; height: 148px; border-radius: 16px; overflow: hidden; position: relative; scroll-snap-align: start; border: 0; padding: 0; color: #fff; text-align: left; display: flex; align-items: flex-end; background: var(--sunk); }
.mday-card .photo { position: absolute; inset: 0; }
.mday-card::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, transparent 30%, rgba(20,12,8,.78)); }
.mday-card .in { position: relative; z-index: 1; padding: 9px; display: flex; flex-direction: column; font-size: 12.5px; line-height: 1.25; }
.mday-card .in b { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; opacity: .9; }
.mday-card .in span { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; font-weight: 500; }
.mday-card.empty { background: none; border: 1.5px dashed var(--line2); color: var(--muted); flex-direction: column; justify-content: center; align-items: center; gap: 2px; }
.mday-card.empty::after { display: none; }
.mday-card.empty b { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; }
.mday-card.empty i { font-style: normal; font-size: 22px; color: var(--brand); }
.mday-card.today { outline: 3px solid var(--brand); outline-offset: -3px; }
.mday-card.past { opacity: .7; filter: saturate(.6); }
.mshopcard { display: flex; align-items: center; gap: 14px; text-align: left; width: 100%; }
.mbrand { background: var(--brand); color: #fff; border-color: var(--brand); }
.mbrand .btn { background: #fff; color: var(--brand); border-color: #fff; }
.story { flex: 0 0 76px; border: 0; background: none; padding: 0; display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 12px; line-height: 1.2; text-align: center; scroll-snap-align: start; }
.story .ringp { width: 72px; height: 72px; border-radius: 99px; padding: 3px; background: conic-gradient(from 200deg, #2c666c, #4ba5a9, #e3ac35, #2c666c); display: block; }
.story .ringp .photo { width: 100%; height: 100%; border-radius: 99px; border: 3px solid var(--bg); }
.story > span:last-child { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.mrow { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--sunk); cursor: pointer; }
.mrow:last-child { border-bottom: 0; }
.mrow .photo { width: 46px; height: 46px; border-radius: 12px; flex: none; }

/* Plan */
.mplanhead { position: sticky; top: 0; z-index: 4; background: var(--bg); margin: 0 -18px; padding: 6px 18px 12px; display: flex; flex-direction: column; gap: 12px; border-bottom: 1px solid var(--line); }
.dpills { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.dpill { border: 1px solid var(--line); background: var(--paper); border-radius: 14px; padding: 6px 0 7px; display: flex; flex-direction: column; align-items: center; gap: 1px; }
.dpill span { font-size: 11px; color: var(--muted); font-weight: 600; }
.dpill b { font-size: 17px; }
.dpill i { width: 5px; height: 5px; border-radius: 99px; background: transparent; }
.dpill.has i { background: var(--brand); }
.dpill.today { background: var(--brand); border-color: var(--brand); color: #fff; }
.dpill.today span { color: #d6eef0; }
.dpill.today.has i { background: #fff; }
.mhint { font-size: 12.5px; color: var(--muted); }
.mdaysec { display: flex; flex-direction: column; gap: 8px; scroll-margin-top: 140px; }
.mdaysec.past { opacity: .6; }
.mdayh { display: flex; align-items: center; gap: 8px; }
.mdayh b { font-size: 15px; }
.mentry { display: flex; align-items: center; gap: 12px; padding: 8px; background: var(--paper); border: 1px solid var(--line); border-radius: 14px; cursor: pointer; }
.mentry .photo { width: 56px; height: 56px; border-radius: 11px; flex: none; }
.mentry .nm { font-weight: 500; line-height: 1.3; }
.mentry.note { font-style: italic; color: var(--fg2); padding: 14px; background: var(--sunk); border-color: transparent; }
.mempty { border: 1.5px dashed var(--line2); background: none; border-radius: 14px; padding: 14px; color: var(--muted); font-weight: 500; width: 100%; }
.mfloat { position: sticky; bottom: 12px; display: flex; justify-content: center; z-index: 3; margin-top: 4px; }
.mfloat .btn { box-shadow: 0 10px 26px rgba(44,102,108,.35); }

/* A row that swipes: right to do the kind thing, left to remove */
.sw { position: relative; border-radius: 14px; overflow: hidden; touch-action: pan-y; user-select: none; flex: none; }
.sw .under { position: absolute; inset: 0; display: flex; justify-content: space-between; align-items: center; padding: 0 18px; font-weight: 600; color: #fff; font-size: 14px; opacity: 0; }
.sw.dir-r .under { opacity: 1; background: var(--ok); }
.sw.dir-l .under { opacity: 1; background: var(--danger); }
.sw.dir-r .ur, .sw.dir-l .ul { visibility: hidden; }
.sw .under span { transition: transform .15s; }
.sw.armed .under span { transform: scale(1.15); }
.sw-in { position: relative; transition: transform .22s cubic-bezier(.2,.9,.3,1); background: var(--bg); }
.sw.dragging .sw-in { transition: none; }

/* Shopping */
.mbar { height: 8px; background: var(--sunk); border-radius: 99px; overflow: hidden; margin-top: -8px; flex: none; }
.mbar i { display: block; height: 100%; background: linear-gradient(90deg, var(--brand), #4ba5a9); border-radius: 99px; transition: width .4s; }
.maddrow { position: relative; flex: none; }
.maddrow .input { padding: 13px 14px 13px 40px; font-size: 16px; border-radius: 14px; }
.maddrow .plus { position: absolute; left: 15px; top: 11px; font-size: 20px; color: var(--muted); }
.maddrow .guess { position: absolute; right: 10px; top: 11px; }
.mchip { flex: none; display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--paper); border-radius: 99px; padding: 5px 12px; font-size: 13px; font-weight: 500; scroll-snap-align: start; white-space: nowrap; }
.mchip .photo { width: 24px; height: 24px; border-radius: 99px; margin-left: -6px; }
.mchip.on { background: var(--fg); border-color: var(--fg); color: #fff; }
.maisle { display: flex; flex-direction: column; }
.maisleh { position: sticky; top: 0; z-index: 2; background: var(--bg); margin: 0 -18px; padding: 10px 18px 6px; display: flex; justify-content: space-between; font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.mitem { display: flex; gap: 14px; align-items: center; padding: 12px 4px; border-bottom: 1px solid var(--sunk); min-height: 58px; cursor: pointer; transition: opacity .22s, transform .22s; }
.mitem .t { font-size: 16.5px; }
.mitem .m { font-size: 12.5px; color: var(--muted); margin-top: 1px; }
.mitem.leaving { opacity: 0; transform: translateX(40px); }
.check.big { width: 26px; height: 26px; border-radius: 8px; border-width: 2px; }
.check.big.on::after { width: 12px; height: 7px; }
.mtrolley { position: sticky; bottom: 10px; margin: 6px 0 4px; display: flex; align-items: center; gap: 8px; border: 0; border-radius: 16px; background: var(--fg); color: #fff; padding: 14px 18px; font-size: 15px; box-shadow: 0 10px 26px rgba(30,20,14,.3); z-index: 3; flex: none; }

/* Recipes */
.mgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.mrc { position: relative; aspect-ratio: 4/5; border-radius: 18px; overflow: hidden; border: 0; padding: 0; color: #fff; text-align: left; display: flex; align-items: flex-end; }
.mrc .photo { position: absolute; inset: 0; }
.mrc::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, transparent 45%, rgba(20,12,8,.8)); }
.mrc .nm { position: relative; z-index: 1; padding: 10px 11px; font-weight: 600; font-size: 14px; line-height: 1.25; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.mrc .time { position: absolute; top: 9px; left: 9px; z-index: 1; background: rgba(20,12,8,.55); font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 99px; backdrop-filter: blur(4px); }
.mrc .heart { position: absolute; top: 7px; right: 7px; z-index: 1; width: 30px; height: 30px; border-radius: 99px; background: rgba(255,252,249,.85); color: var(--fg); display: grid; place-items: center; font-size: 14px; }
.msearch { position: sticky; bottom: 12px; display: flex; gap: 8px; z-index: 3; margin-top: 4px; flex: none; }
.msearch .pill { flex: 1; display: flex; align-items: center; gap: 8px; background: var(--paper); border: 1px solid var(--line2); border-radius: 99px; padding: 0 16px; box-shadow: 0 10px 26px rgba(30,20,14,.16); }
.msearch .pill input { border: 0; outline: none; background: none; flex: 1; padding: 12px 0; font-size: 15px; min-width: 0; }
.msearch .mround { width: 48px; height: 48px; box-shadow: 0 10px 26px rgba(30,20,14,.16); }

/* Recipe: the photo stays put and the page slides up over it */
.mrec { position: relative; min-height: 100%; }
.mrhero { height: 360px; position: sticky; top: 0; }
.mrhero .photo { position: absolute; inset: 0; }
.mrtop { position: absolute; top: 8px; left: 14px; right: 14px; display: flex; gap: 8px; z-index: 2; }
.mrbody { position: relative; z-index: 2; margin-top: -30px; background: var(--bg); border-radius: 26px 26px 0 0; padding: 22px 18px 110px; display: flex; flex-direction: column; gap: 14px; min-height: 520px; box-shadow: 0 -10px 30px rgba(30,20,14,.14); }
.mfacts { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; background: var(--paper); border: 1px solid var(--line); border-radius: 16px; padding: 10px 6px; text-align: center; }
.mfacts div { display: flex; flex-direction: column; }
.mfacts b { font-size: 15px; }
.mfacts span { font-size: 11.5px; color: var(--muted); }
.mseg { display: flex; background: var(--sunk); border-radius: 12px; padding: 3px; gap: 2px; }
.mrbody .mseg { position: sticky; top: 8px; z-index: 3; box-shadow: 0 4px 14px rgba(30,20,14,.08); }
.mseg button { flex: 1; border: 0; background: none; padding: 9px; border-radius: 10px; font-weight: 500; color: var(--fg2); }
.mseg button.on { background: var(--paper); color: var(--fg); box-shadow: 0 1px 3px rgba(0,0,0,.1); }
.mseg.small button { padding: 6px 12px; font-size: 13px; }
.mserves { display: flex; align-items: center; gap: 8px; }
.mserves button { width: 40px; height: 40px; border-radius: 12px; border: 1px solid var(--line2); background: var(--paper); font-size: 18px; }
.ming { display: flex; gap: 14px; align-items: flex-start; padding: 11px 2px; border-bottom: 1px solid var(--sunk); font-size: 16px; line-height: 1.4; cursor: pointer; }
.ming .nt { font-size: 13.5px; color: var(--muted); }
.ming.done > span:last-child { color: var(--muted); text-decoration: line-through; }
.mstep { background: var(--paper); border: 1px solid var(--line); border-radius: 18px; padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; }
.mstep .tx { font-size: 16px; line-height: 1.55; }
.mstep .nt { font-size: 13.5px; color: var(--muted); }
.mneed { display: flex; flex-wrap: wrap; gap: 6px; }
.mstep .timerchip { margin: 0; cursor: pointer; }
.mcookbar { position: sticky; bottom: 0; z-index: 4; display: flex; gap: 8px; padding: 26px 18px 14px; background: linear-gradient(180deg, rgba(247,242,237,0), var(--bg) 40%); margin-top: -100px; }
.mcookbar .btn.primary { flex: 1; }
.mcookbar .mround { width: 50px; height: 50px; }

/* Cook: one step a card, swiped */
.mcook { height: 100%; background: #1d1714; color: #f3ebe3; display: flex; flex-direction: column; }
.mctop { display: flex; gap: 12px; align-items: center; padding: 6px 16px 12px; }
.mctop .segs { display: flex; gap: 3px; margin-top: 7px; }
.mctop .segs i { flex: 1; height: 4px; border-radius: 9px; background: #3a302b; transition: background .2s; }
.mctop .segs i.done { background: #4ba5a9; }
.mctop .segs i.on { background: #f3ebe3; }
.mcards { flex: 1; display: flex; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; min-height: 0; }
.mcards::-webkit-scrollbar { display: none; }
.mccard { flex: 0 0 100%; scroll-snap-align: start; padding: 4px 16px; display: flex; }
.mccard .box { flex: 1; background: #f7f0e9; color: #2a1f19; border-radius: 26px; padding: 24px 22px; display: flex; flex-direction: column; gap: 14px; overflow: auto; }
.mccard .k { font-size: 12px; color: #8a7468; }
.mccard .lbl { font-size: 13px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--brand); }
.mccard .tx { font-size: 25px; line-height: 1.4; }
.mccard .nt { font-size: 15px; color: #8a7468; }
.chip.dark { background: #efe4d9; border-color: transparent; color: #2a1f19; font-size: 13px; padding: 4px 10px; }
.mstart { align-self: flex-start; border: 0; background: var(--brand); color: #fff; border-radius: 12px; padding: 12px 16px; font-weight: 600; font-size: 15px; margin-top: auto; }
.mcfoot { padding: 12px 16px 30px; display: flex; flex-direction: column; gap: 10px; }
.mtimer { display: flex; justify-content: space-between; align-items: center; background: #2a221f; border-radius: 14px; padding: 9px 14px; font-size: 13px; color: #b5a69a; }
.mtimer b { font-size: 22px; color: #f3ebe3; font-variant-numeric: tabular-nums; }
.mcfoot .bigbtn { padding: 16px 22px; }

/* Import */
.mstepper { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
.mstepper i { flex: 1; height: 1.5px; background: var(--line2); }
.mstepper .done { color: var(--brand); font-weight: 600; }
.mstepper .on { color: var(--fg); font-weight: 700; }
.mwarn { background: var(--hi); border: 1px solid #efd18b; border-radius: 18px; padding: 14px 16px; display: flex; flex-direction: column; gap: 6px; }
.mwarnrow { display: flex; gap: 10px; align-items: center; border: 0; background: rgba(255,255,255,.6); border-radius: 12px; padding: 10px 12px; text-align: left; font-size: 14.5px; }
.mok { background: var(--ok-soft); color: var(--ok); border-radius: 14px; padding: 12px 16px; font-weight: 600; }
.mpl { display: flex; gap: 10px; align-items: flex-start; width: 100%; border: 0; background: none; text-align: left; padding: 10px; border-bottom: 1px solid var(--sunk); font-size: 15px; line-height: 1.4; }
.mpl:last-child { border-bottom: 0; }
.msrc { background: var(--sunk); border-radius: 14px; padding: 8px 0; font-size: 13.5px; line-height: 1.5; }
.msrc p { margin: 0; padding: 4px 14px; color: #b0a096; }
.msrc p.lit { background: var(--hi); color: var(--fg); box-shadow: inset 3px 0 0 var(--hi-line); font-weight: 500; }

/* Editor */
.mform { display: flex; flex-direction: column; gap: 12px; }
.mform label { display: flex; flex-direction: column; gap: 6px; font-weight: 500; font-size: 13px; flex: 1; min-width: 0; }
.mform textarea { resize: vertical; line-height: 1.6; font-size: 15px; }
.mparsed { display: flex; gap: 6px; align-items: baseline; flex-wrap: wrap; padding: 6px 0; border-bottom: 1px dashed var(--line); font-size: 14px; }
.mparsed .pq { background: var(--brand-50); color: var(--brand); border: 1px solid var(--brand-soft); border-radius: 6px; padding: 0 6px; font-weight: 600; font-size: 12.5px; }
.mprev .photo { aspect-ratio: 21/10; }
.mprev .in { padding: 16px; display: flex; flex-direction: column; gap: 14px; }

/* Settings */
.mlist { padding: 0; overflow: hidden; }
.mli { display: flex; align-items: center; gap: 12px; width: 100%; border: 0; background: none; padding: 12px 14px; border-bottom: 1px solid var(--sunk); font-size: 15.5px; text-align: left; }
.mli:last-child { border-bottom: 0; }
.mli .ico { width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; font-size: 15px; }
.msticky { position: sticky; top: 0; z-index: 3; background: var(--bg); margin: 0 -18px; padding: 6px 18px 8px; }
.mfoods { padding-right: 16px; }
.mletter { position: sticky; top: 60px; z-index: 2; background: var(--bg); font-weight: 700; color: var(--brand); font-size: 13px; padding: 8px 2px 4px; scroll-margin-top: 60px; }
.mfood { display: flex; gap: 10px; align-items: center; padding: 11px 4px; border-bottom: 1px solid var(--sunk); cursor: pointer; }
.mscrub { position: fixed; right: 3px; top: 230px; display: flex; flex-direction: column; z-index: 5; }
.mscrub button { border: 0; background: none; font-size: 10px; font-weight: 700; color: var(--brand); padding: 1px 4px; line-height: 1.25; }
.mscrub button.off { color: var(--line2); }

/* Sheets, from the bottom, under the thumb */
.msheet-scrim { position: absolute; inset: 0; background: rgba(20,12,8,.38); z-index: 40; display: flex; align-items: flex-end; animation: fadein .2s; }
.msheet-scrim.still, .msheet-scrim.still .msheet { animation: none; }
@keyframes fadein { from { opacity: 0; } }
.msheet { width: 100%; max-height: 86%; background: var(--paper); border-radius: 24px 24px 0 0; padding: 8px 18px 34px; display: flex; flex-direction: column; gap: 12px; animation: sheetup .3s cubic-bezier(.2,.9,.3,1); overflow: auto; }
.msheet.tall { height: 86%; }
@keyframes sheetup { from { transform: translateY(100%); } }
.msheet .grab { width: 40px; height: 5px; border-radius: 3px; background: var(--line2); align-self: center; flex: none; margin-bottom: 4px; }
.mpgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; overflow: auto; padding-bottom: 10px; }
.mptile { position: relative; border: 0; background: none; padding: 0; text-align: left; display: flex; flex-direction: column; gap: 5px; font-size: 13.5px; font-weight: 500; line-height: 1.3; }
.mptile .photo { aspect-ratio: 1; border-radius: 14px; transition: transform .2s; }
.mptile:active .photo { transform: scale(.95); }
.mptile.added .photo { outline: 3px solid var(--brand); outline-offset: -3px; opacity: .85; }
.mptile .tick { position: absolute; top: 8px; right: 8px; width: 28px; height: 28px; border-radius: 99px; background: var(--brand); color: #fff; display: grid; place-items: center; font-weight: 700; }
.mqres { display: flex; flex-direction: column; }
.mqres .opt { display: flex; align-items: center; gap: 12px; padding: 10px 6px; border-radius: 12px; cursor: pointer; }
.mqres .opt.on { background: var(--brand-50); box-shadow: inset 0 0 0 1px var(--brand-soft); }
.mqres .opt .photo, .mqres .opt .ic { width: 38px; height: 38px; border-radius: 10px; flex: none; }
.mqres .opt .ic { background: var(--sunk); display: grid; place-items: center; }
.mqres mark { background: var(--hi); color: inherit; border-radius: 3px; }
.mtries { display: flex; gap: 6px; flex-wrap: wrap; }
.mtries .chip { cursor: pointer; padding: 4px 11px; font-size: 13px; }
.mqin .input { font-size: 17px; padding: 13px 14px; border-radius: 14px; }
.maisles { display: flex; flex-wrap: wrap; gap: 6px; }
.maisles .chip { cursor: pointer; padding: 6px 12px; font-size: 13px; }
.maisles .chip.on { background: var(--brand); color: #fff; border-color: var(--brand); }
#devices button.on { background: #9fd6d9; color: #10282a; }
</style>
</head>
<body>
<div id="chrome">
  <div class="row">
    <h1>Garnish · concepts</h1>
    <div class="seg" id="screens"></div>
  </div>
  <div class="row">
    <div class="seg" id="devices"><button data-d="desktop">Desktop</button><button data-d="phone">Phone</button></div>
    <div class="seg" id="widths"></div>
    <div class="note" id="note"></div>
    <div class="scale" id="scale"></div>

</div>
<div id="stage"><div id="holder"><div id="frame">
  <div class="statusbar"><span>9:41</span><span class="island"></span><span class="sig">▂▄▆█ ◖▮</span></div>

    <button class="logo" data-go="home"><svg viewBox="0 0 18 22" fill="none"><path d="M9 21V6" stroke="#2c666c" stroke-width="1.6" stroke-linecap="round"/><path d="M9 9c-3-.5-5-2.5-5.5-5 3 .2 5 2 5.5 5zm0 4c3-.5 5-2.5 5.5-5-3 .2-5 2-5.5 5zm0 4c-3-.5-5-2.5-5.5-5 3 .2 5 2 5.5 5zM9 6C9 4 9.5 2.5 11 1" fill="#2c666c" stroke="#2c666c" stroke-width=".6"/></svg>Garnish</button>
    <button class="nav" data-go="home">Home</button>

    <button class="cmdk" data-cmd><svg width="15" height="15" viewBox="0 0 16 16" fill="none"><circle cx="7" cy="7" r="5" stroke="currentColor" stroke-width="1.5"/><path d="m11 11 3.5 3.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg><span>Search, plan or add anything…</span><kbd>Ctrl</kbd><kbd>K</kbd></button>

  </nav>

</div></div></div>

<script>
/* ═════════════════════════════════════════════════════════════════════════
   Data: the household's own recipes and photos (data/images, beside the repo)
   ═════════════════════════════════════════════════════════════════════════ */
const IMG = "../../data/images/";
const RECIPES = [
  ["chicken-fried-rice", "Chicken Fried Rice", "270d050a-b55c-4f94-80b5-d068bf6e7637.jpg", 20, ["Weeknight", "One Pot"], "rotation"],
  ["slow-cooked-shredded-beef-ragu-pasta", "Slow Cooked Shredded Beef Ragu Pasta", "4c2dbacc-ba99-4044-9843-d48b4b5b9537.jpg", 230, ["Slow Cooked", "Kid Approved"], "weekend"],
  ["beef-and-broccoli-stir-fry", "Beef and Broccoli Stir-Fry", "3a3a18f7-4b1f-4738-b5dc-953b350bff1f.png", 25, ["Weeknight"], "rotation"],
  ["fish-tacos", "Fish Tacos", "6876a90f-e8c2-4ef4-97b7-9b9b7bad230b.png", 30, ["Weeknight", "Kid Approved"], "rotation"],
  ["steak-and-mushroom-pie", "Steak and Mushroom Pie", "4277a90a-4ff0-40f2-8dfb-4585c04c3708.png", 180, ["Baking"], "weekend"],
  ["mushroom-risotto", "Mushroom Risotto", "c257104c-e093-461c-9b6f-7fef867b6b0b.png", 45, ["One Pot"], "rotation"],
  ["chicken-and-potato-tray-bake", "Chicken and Potato Tray Bake", "b0a2fc77-5ece-4976-9576-7885e47d19df.png", 60, ["One Pot", "Weeknight"], "rotation"],
  ["lemon-tart", "Lemon Tart", "727f6535-0188-4ba9-9b3e-7c0292245f6d.png", 90, ["Dessert", "Baking"], "totry"],
  ["banana-cake", "Banana Cake", "50bd6825-e565-448b-ae71-8adb2a5cb7a4.png", 70, ["Dessert", "Baking"], "totry"],
  ["tomato-and-basil-pasta", "Tomato and Basil Pasta", "ef617603-40f6-4709-8692-9b63a68f9c4c.png", 25, ["Weeknight"], "totry"],
  ["roast-pumpkin-soup", "Roast Pumpkin Soup", "f798ccd0-16e1-46c2-86c3-9a7a02446415.png", 50, ["One Pot"], "rotation"],
  ["slow-cooked-lamb-shoulder", "Slow-Cooked Lamb Shoulder", "14a9ce35-7345-4e11-9610-231c24005c8e.png", 300, ["Slow Cooked"], "weekend"],
  ["roast-chicken", "Roast Chicken with Charred Corn, Pickled Onion and a Whipped Fetta That Is Frankly the Best Part", "1521c5b0-f335-4c68-b4c4-1f110be62aef.png", 90, ["BBQ"], "weekend"],
  ["chickpea-curry", "Chickpea Curry", null, 35, ["Curry", "Weeknight"], "rotation"],
  ["roast-pumpkin-and-fetta-salad", "Roast Pumpkin and Fetta Salad", null, 40, [], "totry"],
  ["anzac-biscuits", "Anzac Biscuits", null, 30, ["Baking", "Dessert"], ""],
  ["beef-burgers", "Beef Burgers", null, 30, ["BBQ", "Kid Approved"], "weekend"],
  ["weeknight-stir-fry", "Weeknight Stir-fry", null, 20, ["Weeknight"], "rotation"],
].map(([slug, name, img, mins, tags, coll], i) => ({ slug, name, img, mins, tags, coll, fav: i % 5 === 1, last: [3, 9, 1, 2, 14, 7, 4, 0, 0, 0, 6, 11, 8, 2, 0, 20, 5, 1][i] }));
const R = Object.fromEntries(RECIPES.map((r) => [r.slug, r]));

const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
function hue(s) { let h = 0; for (const c of s) h = (h * 31 + c.charCodeAt(0)) % 360; return h; }
function photo(r, extra = "") {
  const h = hue(r.slug), g = `linear-gradient(135deg, hsl(${(h % 50) + 15} 45% 72%), hsl(${(h % 40) + 5} 40% 48%))`;
  const bg = r.img ? `url('${IMG}${r.img}'), ${g}` : g;
  return `<div class="photo" style="background-image:${bg};${extra}"></div>`;
}
function mins(m) { if (m < 60) return `${m} min`; const h = Math.floor(m / 60), r = m % 60; return r ? `${h} hr ${r} min` : `${h} hr`; }
function fmtQ(q) {
  if (q >= 10) return String(Math.round(q));
  const w = Math.floor(q + 1e-9), f = q - w;
  const fr = [[0, ""], [0.125, "⅛"], [0.25, "¼"], [1 / 3, "⅓"], [0.5, "½"], [2 / 3, "⅔"], [0.75, "¾"], [1, ""]];
  let best = fr[0], d = 9; for (const x of fr) { const dd = Math.abs(f - x[0]); if (dd < d) { d = dd; best = x; } }
  if (d > 0.04) return String(Math.round(q * 10) / 10);
  const W = w + (best[0] === 1 ? 1 : 0);
  return (W ? String(W) : "") + best[1] || "0";
}
function toast(html) { if (S.device === "phone") $("#toasts").replaceChildren(); const t = document.createElement("div"); t.className = "toast"; t.innerHTML = html; $("#toasts").append(t); setTimeout(() => t.remove(), 3200); }
function dayOf(iso) { return ALLDAYS.find((d) => d.iso === iso); }
function shortList(slug) {
  const src = SHORT[slug] || GENERIC;
  const ings = src.filter((x) => x.includes("|")).map((x) => x.split("|"));
  const steps = src.filter((x) => !x.includes("|")).map((x) => x.split(": "));
  return { ings, steps };
}

const DAYWORDS = { mon: 0, monday: 0, tue: 1, tues: 1, tuesday: 1, wed: 2, wednesday: 2, thu: 3, thur: 3, thurs: 3, thursday: 3, fri: 4, friday: 4, sat: 5, saturday: 5, sun: 6, sunday: 6 };

    opts.push({ g: "Do", kind: "go", to: "plan", icon: "▦", label: "Plan next week", hint: "5 empty nights" });

  }

  const last = words[words.length - 1];
  if (last in DAYWORDS || last === "tonight" || last === "tomorrow") { day = last === "tonight" ? TODAY : last === "tomorrow" ? "2026-11-08" : (() => { const idx = DAYWORDS[last]; const d = WEEKS[0].days[idx]; return d.iso >= TODAY ? d.iso : WEEKS[1].days[idx].iso; })(); w = words.slice(0, -1); }
  const hits = w.length ? RECIPES.filter((r) => w.every((x) => r.name.toLowerCase().includes(x) || r.tags.some((t) => t.toLowerCase().includes(x)))) : [];
  if (day) { const d = dayOf(day); hits.slice(0, 4).forEach((r) => opts.push({ g: "Plan", kind: "plan", r, day, label: `Put ${r.name} on ${d.long} ${d.d}`, hint: "↵" })); }

  ["Home", "Plan", "Shopping", "Recipes", "Settings", "Foods", "Backup", "Style"].filter((n) => n.toLowerCase().startsWith(words[0])).forEach((n) => opts.push({ g: "Go to", kind: "go", to: { Shopping: "shop", Foods: "settings", Backup: "settings", Style: "settings" }[n] || n.toLowerCase(), icon: "→", label: n }));

function openPalette() {

}

/* Swipes: a row follows the finger (or the mouse) and does its thing past 90px */
let SW = null, swiped = false;
frame.addEventListener("pointerdown", (e) => { if (S.device !== "phone") return; const row = e.target.closest("[data-swipe]"); if (row) SW = { row, x: e.clientX, y: e.clientY, dx: 0, active: false, id: e.pointerId }; });
frame.addEventListener("pointermove", (e) => {
  if (!SW) return;
  const dx = (e.clientX - SW.x) / SCALE, dy = (e.clientY - SW.y) / SCALE;
  if (!SW.active) { if (Math.abs(dx) > 8 && Math.abs(dx) > Math.abs(dy)) { SW.active = true; SW.row.classList.add("dragging"); try { SW.row.setPointerCapture(SW.id); } catch {} } else if (Math.abs(dy) > 8) { SW = null; return; } else return; }
  let x = dx; if (x > 0 && !SW.row.hasAttribute("data-r")) x = 0; if (x < 0 && !SW.row.hasAttribute("data-l")) x = 0;
  SW.dx = x; SW.row.querySelector(".sw-in").style.transform = `translateX(${x}px)`;
  SW.row.classList.toggle("dir-r", x > 0); SW.row.classList.toggle("dir-l", x < 0); SW.row.classList.toggle("armed", Math.abs(x) > 90);
});
function swipeEnd() {
  if (!SW) return; const { row, dx, active } = SW; SW = null; if (!active) return;
  swiped = true; setTimeout(() => (swiped = false), 60);
  const inn = row.querySelector(".sw-in"); row.classList.remove("dragging");
  if (Math.abs(dx) > 90) { inn.style.transform = `translateX(${dx > 0 ? 110 : -110}%)`; setTimeout(() => doSwipe(row.dataset.swipe, dx > 0 ? "r" : "l"), 200); }
  else { inn.style.transform = ""; row.classList.remove("dir-r", "dir-l", "armed"); }
}
frame.addEventListener("pointerup", swipeEnd); frame.addEventListener("pointercancel", swipeEnd);
function doSwipe(key, dir) {
  const [kind, a, b] = key.split(":");
  if (kind === "shop") { const it = SHOP.find((i) => i.id === a); it.done = true; toast(`<b>${esc(it.name)}</b> is in the trolley`); }
  if (kind === "plan") {
    const es = S.plan[a], e = es[Number(b)], nm = esc(e.text || R[e.slug].name);
    if (dir === "l") { es.splice(Number(b), 1); toast(`Removed ${nm} · <b>Undo</b>`); }
    else { const nx = ALLDAYS[ALLDAYS.findIndex((d) => d.iso === a) + 1]; if (nx) { es.splice(Number(b), 1); (S.plan[nx.iso] ||= []).push(e); toast(`${nm} → <b>${nx.long}</b>`); } }
  }
  if (kind === "food") { const i = FOODS.findIndex((f) => f.id === a); const f = FOODS.splice(i, 1)[0]; toast(`Deleted <b>${esc(f.name)}</b> · Undo`); }
  render(true);
}

/* The phone's own presses, caught before the shared handler */
frame.addEventListener("click", (e) => {
  if (swiped) { e.stopImmediatePropagation(); e.preventDefault(); return; }
  if (S.device !== "phone") return;
  const t = e.target, stop = () => e.stopImmediatePropagation();
  let x;
  if (t.closest("[data-mquick]")) { stop(); return openSheet({ kind: "quick" }); }
  if (t.closest("[data-msheet-close]") || t.classList.contains("msheet-scrim")) { stop(); return closeSheet(); }
  if ((x = t.closest("[data-msheet]"))) { stop(); return openSheet({ kind: x.dataset.msheet }); }
  if ((x = t.closest("[data-mpick]"))) { stop(); S.mpq = ""; return openSheet({ kind: "picker", iso: x.dataset.mpick }); }
  if ((x = t.closest("[data-madd]"))) { stop(); addToPlan(S.msheet.iso, { slug: x.dataset.madd }); render(true); return; }
  if ((x = t.closest("[data-mnote]"))) { stop(); addToPlan(S.msheet.iso, { text: x.dataset.mnote }); S.mpq = ""; render(true); return; }
  if ((x = t.closest("[data-mptab]"))) { stop(); S.mpTab = x.dataset.mptab; return renderSheet(); }
  if ((x = t.closest("[data-mjump]"))) { stop(); $("#d-" + x.dataset.mjump)?.scrollIntoView({ behavior: "smooth", block: "start" }); return; }
  if ((x = t.closest("[data-mmeal]"))) { stop(); S.mMeal = x.dataset.mmeal || null; return render(true); }
  if ((x = t.closest("[data-mseg]"))) { stop(); S.mseg = x.dataset.mseg; return render(true); }
  if ((x = t.closest("[data-mcheck]"))) { stop(); x.querySelector(".check").classList.toggle("on"); x.classList.toggle("done"); return; }
  if ((x = t.closest("[data-mtimer]"))) { stop(); const s = FR.steps[Number(x.dataset.mtimer)]; TIMERS.push({ label: s[0], left: Math.round(s[4] * 60), run: true }); return toast(`◷ <b>${esc(s[0])}</b> · ${fmtQ(s[4])} min`); }
  if ((x = t.closest("[data-mcstep]"))) { stop(); return mCookGo((S.mcook || 0) + Number(x.dataset.mcstep)); }
  if ((x = t.closest("[data-tstart-m]"))) { stop(); const s = FR.steps[Number(x.dataset.tstartM)]; TIMERS.push({ label: s[0], left: Math.round(s[4] * 60), run: true }); return render(true); }
  if ((x = t.closest("[data-mfixok]"))) { stop(); (S.mfixed ||= new Set()).add(S.msheet.key); S.msheet = null; toast("Marked as right"); return render(true); }
  if ((x = t.closest("[data-mflag]"))) { stop(); return openSheet({ kind: "flag", key: x.dataset.mflag }); }
  if ((x = t.closest("[data-medit]"))) { stop(); S.medit = x.dataset.medit; return render(true); }
  if ((x = t.closest("[data-mset]"))) { stop(); const v = x.dataset.mset; if (v === "menu" || v === "foods") { S.mset = v; render(false); $("#view").scrollTop = 0; } else toast(`${v[0].toUpperCase() + v.slice(1)} isn't in this mockup`); return; }
  if ((x = t.closest("[data-mfood]"))) { stop(); return openSheet({ kind: "food", id: x.dataset.mfood }); }
  if ((x = t.closest("[data-maisle]"))) { stop(); const f = FOODS.find((y) => y.id === S.msheet.id); f.aisle = x.dataset.maisle; toast(`<b>${esc(f.name)}</b> → ${f.aisle}`); return render(true); }
  if ((x = t.closest("[data-malias]"))) { stop(); const f = FOODS.find((y) => y.id === S.msheet.id); f.aliases = f.aliases.split(", ").filter((a) => a !== x.dataset.malias).join(", "); return render(true); }
  if ((x = t.closest("[data-mletter]"))) { stop(); $("#L-" + x.dataset.mletter)?.scrollIntoView({ block: "start" }); return; }
  if ((x = t.closest("[data-mtry]"))) { stop(); PAL.q = x.dataset.mtry; $("#mq").value = PAL.q; $("#mqres").innerHTML = quickRes(); return; }
  if ((x = t.closest("[data-mclear]"))) { stop(); S.lib.tags.clear(); return render(true); }
  if ((x = t.closest("[data-pi]")) && S.msheet?.kind === "quick") { stop(); S.msheet = null; return palDo(PAL.opts[Number(x.dataset.pi)]); }
  if ((x = t.closest("[data-open]")) && S.msheet) S.msheet = null;
}, true);
frame.addEventListener("input", (e) => {
  if (S.device !== "phone") return;
  const t = e.target;
  if (t.id === "mq") { PAL.q = t.value; $("#mqres").innerHTML = quickRes(); }
  if (t.id === "mpq") { S.mpq = t.value; const pos = t.selectionStart; renderSheet(); const n = $("#mpq"); n.focus(); n.setSelectionRange(pos, pos); }
  if (t.id === "mfoodq") { S.mfoodq = t.value; const pos = t.selectionStart; render(true); const n = $("#mfoodq"); n.focus(); n.setSelectionRange(pos, pos); }
});
frame.addEventListener("keydown", (e) => {
  if (S.device !== "phone") return;
  if (e.target.id === "mq" && e.key === "Enter" && PAL.opts[0]) { e.preventDefault(); S.msheet = null; palDo(PAL.opts[0]); }
});

/* Start where the last visit left off */
try { const m = JSON.parse(localStorage.getItem("garnish-mock") || "null"); if (m) { S.screen = m.screen in RENDER ? m.screen : "home"; S.width = m.width; S.device = m.device === "phone" ? "phone" : "desktop"; } } catch {}
render(false); layout();
</script>
</body>
